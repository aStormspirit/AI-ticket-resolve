[project]
name = "ticket-bot"
version = "1.0.0"
description = "Автоматизация обработки тикетов службы поддержки на LLM-агенте"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arq>=0.28.0",
    "colorlog>=6.12.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "langchain>=1.3.14",
    "langchain-openai>=1.3.5",
    "langchain-openrouter>=0.2.6",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
    "redis>=5.3.1",
    "scikit-learn>=1.9.0",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
]

[tool.hatch.build.targets.wheel]
packages = ["bot", "app", "worker", "observability"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
