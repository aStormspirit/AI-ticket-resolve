groups:
  - name: ticket-bot-recording
    interval: 30s
    rules:
      # Доля автоматических разрешений считается здесь, а не в приложении:
      # gauge, усреднённый за время жизни процесса, вводил бы в заблуждение.
      - record: support:auto_resolution_rate:1h
        expr: |
          sum(rate(support_tickets_auto_resolved_total[1h]))
          /
          clamp_min(sum(rate(support_tickets_received_total[1h])), 1e-9)

      - record: support:escalation_rate:1h
        expr: |
          sum(rate(support_tickets_escalated_total[1h]))
          /
          clamp_min(sum(rate(support_tickets_received_total[1h])), 1e-9)

      - record: support:handle_time_p95:5m
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, resolution_type) (rate(support_ticket_handle_time_seconds_bucket[5m]))
          )

  - name: ticket-bot-alerts
    rules:
      - alert: LatencyBudgetExceeded
        expr: support:handle_time_p95:5m{resolution_type="auto"} > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: p95 автоматической обработки превышает бюджет 10s

      - alert: CircuitBreakerOpen
        expr: support_circuit_breaker_state == 2
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Circuit breaker {{ $labels.target }} разомкнут — тикеты уходят операторам"

      - alert: AutoResolutionRateDropped
        expr: support:auto_resolution_rate:1h < 0.2
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Доля автоматических разрешений упала ниже 20%

      - alert: LLMErrorRateHigh
        expr: sum(rate(support_llm_errors_total[5m])) > 0.5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Высокая частота ошибок обращения к LLM
