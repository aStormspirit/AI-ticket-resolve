global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: ticket-bot-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # Реплик воркера несколько, поэтому цели берутся из DNS сервиса, а не списком:
  # встроенный DNS Docker возвращает адреса всех контейнеров сервиса.
  - job_name: ticket-bot-worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9001
